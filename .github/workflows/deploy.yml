name: 部署到 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vault 是唯一数据源（私有仓库：GITHUB_TOKEN 跨仓库无效，用 VAULT_TOKEN PAT）
      - uses: actions/checkout@v4
        with:
          repository: baiolun/knowledge-vault
          ref: master
          token: ${{ secrets.VAULT_TOKEN }}
          path: knowledge-vault
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VAULT_DIR: ${{ github.workspace }}/knowledge-vault
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
